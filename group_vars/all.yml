---
# maintains ports, bianry or repo urls

org: encapsulate
domain_regex: ^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
monitor_server_dns: monitor.encapsulate.xyz
ansible_port: 8192

architecture_map:
  x86_64: amd64
  aarch64: arm64

default_node_types:
  - validator
  - default

tmp_dir: /tmp

rust:
  root: /opt
  path: /opt/cargo

espresso:
  validator:
    source_url: https://github.com/EspressoSystems/espresso-network
    ports:
      api_port: 8088
      p2p_port: 4455
      cliquent_port: 9977
