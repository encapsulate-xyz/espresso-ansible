---
- name: Clone the repository
  ansible.builtin.git:
    repo: "{{ espresso.validator.source_url }}"
    dest: "{{ tmp_dir }}/{{ project }}"
    version: "{{ espresso.validator.version }}"
    force: true

- name: Build the binary
  ansible.builtin.command:
    cmd: cargo build -p sequencer -p staking-cli --release
    chdir: "{{ tmp_dir }}/{{ project }}"
  register: build_binary
  changed_when: false
  environment:
    PATH: "{{ rust.path }}/bin:{{ ansible_env.PATH }}"
    RUSTUP_HOME: "{{ rust.root }}/cargo"
    CARGO_HOME: "{{ rust.root }}/cargo"

- name: Copy the built binaries to the target directory
  ansible.builtin.copy:
    src: "{{ tmp_dir }}/{{ project }}/target/release/{{ item.src }}"
    dest: "{{ node_bin_dir }}/{{ item.dest }}"
    mode: "0755"
    owner: root
    group: root
    remote_src: true
    force: true
  loop:
    - src: "{{ node_service_default_binary_name }}"
      dest: "{{ service_identifier }}"
    - src: "{{ node_cli_default_binary_name }}"
      dest: "{{ service_identifier }}-cli"
  notify:
    - Restart service

- name: Clean up the temporary repository directory
  ansible.builtin.file:
    path: "{{ tmp_dir }}/{{ project }}"
    state: absent
