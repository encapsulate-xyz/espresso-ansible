---
- name: Create Docker container and copy binary
  vars:
    container_name: espresso
    extracted_binary_path: "{{ tmp_dir }}/espresso-node-postgres"
  block:
    - name: Create temporary espresso container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ espresso.validator.docker_source_url }}:{{ espresso.validator.version }}"
        state: present
        recreate: true

    - name: Copy espresso binary out of the container
      ansible.builtin.command:
        cmd: docker cp {{ container_name }}:/bin/espresso-node-postgres {{ extracted_binary_path }}
      changed_when: false

    - name: Install espresso binary
      ansible.builtin.copy:
        src: "{{ extracted_binary_path }}"
        dest: "{{ node_bin_dir }}/{{ service_identifier }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
        force: true
      notify:
        - Restart service

  always:
    - name: Remove espresso container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Remove extracted binary
      ansible.builtin.file:
        path: "{{ extracted_binary_path }}"
        state: absent
